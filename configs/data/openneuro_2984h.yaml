# OpenNeuro subset: 3,890 within-study subject IDs, 708 studies, 2,984 h of
# stored BOLD. Nested inside every larger subset.
# Shards from studies since withdrawn from OpenNeuro are not in the public bucket.
# The paper trained on all 3,890; the public bucket serves the remaining 3,817 (691
# studies, 2,946 h). The glob needs no edit: withdrawn shards are simply absent.
data:
  urls:
    - "s3://openneuro/v1/openneuro-pretrain-shards-v6{,-b{1..3}}/train/native"
