# HCP-YA, 880 participants, 1,482 h of stored BOLD, vendor MNI pipeline
# (FNIRT to MNI152NLin6Asym on the shipped MNI BOLD). Same participants as
# hcp_native.yaml.
data:
  urls:
    - s3://<RESTRICTED_ROOT>/hcp-ya-pretrain-shards-v6-native/train/mni
# The paper's HCP-YA runs also scored the 100 held-out HCP-YA participants
# (Brainmarks batches 16-17) in both preparations. The appendix loss table uses the
# set in the run's own preparation; openneuro_heldout gives its 0.873 / 0.893.
validation:
  sets:
    hcp_native: s3://<RESTRICTED_ROOT>/hcp-ya-pretrain-shards-v6-native/val/native
    hcp_mni: s3://<RESTRICTED_ROOT>/hcp-ya-pretrain-shards-v6-native/val/mni
    openneuro_heldout: s3://openneuro/v1/openneuro-pretrain-shards-v6-b31/train/native
