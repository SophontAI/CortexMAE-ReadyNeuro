[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# The `eval` extra pins Brainmarks and ReadyNeuro by git URL.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/fmrifm", "src/brainmarks"]

[project]
name = "cortexmae-readyneuro"
version = "0.1.0"
description = "Masked-autoencoder pretraining on native-space (rigidly aligned) fMRI, and its frozen-encoder evaluation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [
    { name = "Xujin Chris Liu" },
    { name = "Connor Lane" },
    { name = "Hassan Muhammad" },
    { name = "Tanishq Abraham" },
    { name = "Paul Scotti" },
]
maintainers = [{ name = "Sophont AI", email = "paul@sophont.med" }]
dependencies = [
    "einops>=0.8.2",
    "jsonargparse[signatures]>=4.49.0",
    "lightning>=2.6.5",
    "numpy>=2.4.6",
    "pyyaml>=6.0.3",
    "s3fs>=2024.6.1",
    "safetensors>=0.8.0",
    "timm>=1.0.27",
    "torch>=2.11.0,<2.12",
    "torchdata>=0.11.0",
    "torchmetrics>=1.9.0",
    # Not imported here (timm needs it); listed so it comes from the same CUDA index as torch.
    "torchvision>=0.26.0,<0.27",
    "tqdm>=4.66",
    "wandb>=0.27.0",
    "webdataset>=1.0.2",
]

[project.optional-dependencies]
# The benchmark suite (pinned fork commit) and ReadyNeuro's evaluation data loaders, both from git.
# datasets is pinned here because Brainmarks declares it unbounded, and a resolver that
# picks an old one fails at import against modern pyarrow (no pa.PyExtensionType).
eval = [
    "brainmarks @ git+https://github.com/Aceticia/Brainmarks@d4640074168f1c6dcb0a94ec78801577792be3f4",
    "datasets>=4.8.5",
    "readyneuro[eval] @ git+https://github.com/SophontAI/ReadyNeuro@v0.1.0",
]

[project.urls]
Repository = "https://github.com/SophontAI/CortexMAE-ReadyNeuro"

# The paper's runs used the CUDA 12.8 build of torch 2.11.0 (PyPI's Linux wheels are CUDA 13).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[tool.uv]
# peft (via brainmarks) leaves transformers unbounded; without a floor uv backtracks to
# transformers 4.12 / tokenizers 0.10, which has no Python 3.14 wheel and fails to build.
constraint-dependencies = ["transformers>=4.46"]

[dependency-groups]
dev = ["pytest>=9.0.3"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
ignore = ["F722"]
